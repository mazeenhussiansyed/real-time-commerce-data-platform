name: Commerce Platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            src \
            scripts \
            tests \
            airflow/dags

      - name: Run unit suite
        run: |
          python -m unittest discover \
            -s tests \
            -v

      - name: Check Git whitespace
        run: git diff --check

  container-validation:
    name: Compose and container validation
    runs-on: ubuntu-latest
    needs:
      - python-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CI environment
        run: |
          cp .env.example .env
          sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
          sed -i "s|^COMMERCE_PROJECT_HOST_PATH=.*|COMMERCE_PROJECT_HOST_PATH=$GITHUB_WORKSPACE|" .env
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$(stat -c %g /var/run/docker.sock)/" .env

      - name: Validate core Compose configuration
        run: docker compose config >/dev/null

      - name: Validate complete Compose configuration
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.airflow.yaml \
            config >/dev/null

      - name: Build dbt image
        run: |
          docker build \
            -f Dockerfile.dbt \
            -t commerce-dbt:ci \
            .

      - name: Verify dbt image
        run: |
          docker run --rm \
            commerce-dbt:ci \
            --version

      - name: Build Airflow image
        run: |
          docker build \
            -f Dockerfile.airflow \
            -t commerce-airflow:ci \
            .

      - name: Verify Airflow image
        run: |
          docker run --rm \
            commerce-airflow:ci \
            airflow version
