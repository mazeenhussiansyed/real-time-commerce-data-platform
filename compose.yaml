name: real-time-commerce

services:
  postgres:
    image: postgres:17-alpine
    container_name: commerce-postgres
    environment:
      POSTGRES_DB: ${COMMERCE_POSTGRES_DB:-commerce}
      POSTGRES_USER: ${COMMERCE_POSTGRES_USER:-commerce_app}
      POSTGRES_PASSWORD: ${COMMERCE_POSTGRES_PASSWORD:-commerce_dev_password}
    ports:
      - "127.0.0.1:${COMMERCE_POSTGRES_PORT:-5433}:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${COMMERCE_POSTGRES_USER:-commerce_app} -d ${COMMERCE_POSTGRES_DB:-commerce}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  warehouse:
    image: postgres:17-alpine
    container_name: commerce-warehouse
    environment:
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-analytics}
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-warehouse_app}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-warehouse_dev_password}
    ports:
      - "127.0.0.1:${WAREHOUSE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - commerce_warehouse_data:/var/lib/postgresql/data
      - ./infrastructure/warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${WAREHOUSE_POSTGRES_USER:-warehouse_app} -d ${WAREHOUSE_POSTGRES_DB:-analytics}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    container_name: commerce-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - commerce_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:3.5.2.Final
    container_name: commerce-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: commerce-connect-cluster
      CONFIG_STORAGE_TOPIC: commerce_connect_configs
      OFFSET_STORAGE_TOPIC: commerce_connect_offsets
      STATUS_STORAGE_TOPIC: commerce_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8083/connectors >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  spark:
    image: apache/spark:4.2.0-python3
    user: "0:0"
    working_dir: /workspace
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace/src
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BRONZE_PATH: /workspace/data/landing/bronze
      QUARANTINE_PATH: /workspace/data/quarantine/bronze
      CHECKPOINT_PATH: /workspace/data/checkpoints/bronze
    volumes:
      - ./:/workspace
      - commerce_spark_ivy:/tmp/.ivy2
      - commerce_bronze_data:/workspace/data/landing
      - commerce_quarantine_data:/workspace/data/quarantine
      - commerce_spark_checkpoints:/workspace/data/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - spark
    entrypoint:
      - /opt/spark/bin/spark-submit
    command:
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.sql.shuffle.partitions=4
      - /workspace/scripts/run_bronze_stream.py

volumes:
  commerce_postgres_data:
    name: commerce-postgres-data

  commerce_warehouse_data:
    name: commerce-warehouse-data

  commerce_kafka_data:
    name: commerce-kafka-data

  commerce_spark_ivy:
    name: commerce-spark-ivy

  commerce_bronze_data:
    name: commerce-bronze-data

  commerce_quarantine_data:
    name: commerce-quarantine-data

  commerce_spark_checkpoints:
    name: commerce-spark-checkpoints
