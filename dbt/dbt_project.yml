name: commerce_analytics
version: "1.0.0"
config-version: 2

profile: commerce_analytics

model-paths:
  - models

analysis-paths:
  - analyses

test-paths:
  - tests

seed-paths:
  - seeds

macro-paths:
  - macros

snapshot-paths:
  - snapshots

target-path: target

clean-targets:
  - target
  - dbt_packages

models:
  commerce_analytics:
    staging:
      +schema: staging
      +materialized: view

    intermediate:
      +schema: staging
      +materialized: view

    marts:
      +schema: analytics
      +materialized: table

snapshots:
  commerce_analytics:
    +target_schema: snapshots
