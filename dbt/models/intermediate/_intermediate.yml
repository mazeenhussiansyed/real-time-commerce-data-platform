version: 2

models:
  - name: int_customers_current
    description: Latest non-deleted version of every customer.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: int_products_current
    description: Latest non-deleted version of every product.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: int_orders_current
    description: Latest non-deleted version of every order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_customers_current')
                field: customer_id

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - created
                  - confirmed
                  - processing
                  - shipped
                  - delivered
                  - cancelled

  - name: int_order_items_current
    description: Latest non-deleted version of every order item.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_orders_current')
                field: order_id

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_products_current')
                field: product_id

  - name: int_payments_current
    description: Latest non-deleted version of every payment.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_orders_current')
                field: order_id

      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - pending
                  - authorized
                  - captured
                  - refunded

  - name: int_shipments_current
    description: Latest non-deleted version of every shipment.
    columns:
      - name: shipment_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_orders_current')
                field: order_id

      - name: shipment_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - packed
                  - shipped
                  - delivered
